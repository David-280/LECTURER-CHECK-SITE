<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="results-container">

  <!-- LOADING SCREEN -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <p id="loadingText">Analyzing...</p>
  </div>

  <!-- RESULT -->
  <div id="resultContent" style="display:none;">

    <h1>Analysis Result</h1>

    <img id="resultImage" />

    <div class="results-box">
      <p id="strictness"></p>
      <p id="marking"></p>
      <p id="attendance"></p>
      <p id="personality"></p>
    </div>

    <button onclick="goBack()">Try Again</button>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
